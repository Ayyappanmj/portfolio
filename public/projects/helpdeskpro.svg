<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <pattern id="grid-hd" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#27272a" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="#09090b"/>
  <rect width="800" height="450" fill="url(#grid-hd)"/>
  <rect x="25" y="25" width="750" height="400" rx="14" fill="#121215" stroke="#27272a" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="25" y="25" width="750" height="42" rx="14" fill="#18181b"/>
  <circle cx="50" cy="46" r="5" fill="#3f3f46"/>
  <circle cx="66" cy="46" r="5" fill="#3f3f46"/>
  <circle cx="82" cy="46" r="5" fill="#3f3f46"/>
  <text x="105" y="50" fill="#a1a1aa" font-family="monospace" font-size="12">helpdeskpro :: itil-service-desk :: osticket-analytics</text>
  <rect x="625" y="35" width="135" height="22" rx="6" fill="#121215" stroke="#27272a" stroke-width="1"/>
  <text x="692" y="50" fill="#10b981" font-family="monospace" font-size="11" text-anchor="middle">● SLA: 98.6% COMPLIANT</text>

  <!-- Left: Service Desk Queue & Escalation -->
  <g transform="translate(45, 85)">
    <rect x="0" y="0" width="345" height="315" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="18" y="28" fill="#fafafa" font-family="monospace" font-size="13" font-weight="bold">ITIL TICKET ESCALATION</text>
    <text x="18" y="48" fill="#71717a" font-family="monospace" font-size="11">Tiered L1 / L2 · Critical-to-Low SLA Matrices</text>

    <!-- Ticket Queue Box -->
    <rect x="18" y="65" width="309" height="150" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
    <text x="28" y="88" fill="#ef4444" font-family="monospace" font-size="10">#1042 [CRITICAL] Core Switch Gateway Unreachable</text>
    <text x="38" y="104" fill="#71717a" font-family="monospace" font-size="10">SLA: 1hr · Assigned to L2 NetOps · In Progress</text>
    <text x="28" y="126" fill="#eab308" font-family="monospace" font-size="10">#1041 [HIGH] User Account Locked - Event ID 4740</text>
    <text x="38" y="142" fill="#71717a" font-family="monospace" font-size="10">SLA: 4hr · Assigned to L1 Helpdesk · Resolved</text>
    <text x="28" y="164" fill="#10b981" font-family="monospace" font-size="10">#1040 [NORMAL] VPN Tunnel Renegotiation Failure</text>
    <text x="38" y="180" fill="#71717a" font-family="monospace" font-size="10">SLA: 8hr · Resolved with KB-SOP #12</text>
    <text x="28" y="202" fill="#10b981" font-family="monospace" font-size="10">✓ 15 Knowledge Base SOPs documented</text>

    <!-- Escalation Flow -->
    <rect x="18" y="230" width="309" height="60" rx="6" fill="#121215" stroke="#27272a" stroke-width="1"/>
    <text x="28" y="252" fill="#71717a" font-family="monospace" font-size="10">WORKFLOW ENGINE</text>
    <text x="28" y="272" fill="#fafafa" font-family="monospace" font-size="12" font-weight="bold">4 Departments · Auto-Routing</text>
  </g>

  <!-- Right: Python CLI Analytics & Patterns -->
  <g transform="translate(410, 85)">
    <rect x="0" y="0" width="345" height="315" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="18" y="28" fill="#fafafa" font-family="monospace" font-size="13" font-weight="bold">INCIDENT ANALYTICS ENGINE</text>
    <text x="18" y="48" fill="#71717a" font-family="monospace" font-size="11">Python CLI Tool for Pattern Mining &amp; MTTR</text>

    <rect x="18" y="65" width="309" height="135" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
    <text x="28" y="88" fill="#71717a" font-family="monospace" font-size="10">$ python -m helpdesk_analytics --report=weekly</text>
    <text x="28" y="110" fill="#fafafa" font-family="monospace" font-size="11">Mean Time to Resolution (MTTR): 28.4m</text>
    <text x="28" y="130" fill="#10b981" font-family="monospace" font-size="10">Top Issue: VPN Profile Stale Cache (42%)</text>
    <text x="28" y="148" fill="#10b981" font-family="monospace" font-size="10">Root Cause Identified: Meraki DNS handover</text>
    <text x="28" y="168" fill="#fafafa" font-family="monospace" font-size="10">Automated SOP Dispatched to L1 staff</text>
    <text x="28" y="188" fill="#71717a" font-family="monospace" font-size="10">20 Real-World Incident Runbooks compiled</text>

    <!-- Metrics -->
    <rect x="18" y="215" width="145" height="75" rx="6" fill="#121215" stroke="#27272a" stroke-width="1"/>
    <text x="28" y="238" fill="#71717a" font-family="monospace" font-size="10">PLATFORM</text>
    <text x="28" y="258" fill="#fafafa" font-family="monospace" font-size="13" font-weight="bold">osTicket</text>
    <text x="28" y="276" fill="#10b981" font-family="monospace" font-size="10">Apache / MySQL</text>

    <rect x="182" y="215" width="145" height="75" rx="6" fill="#121215" stroke="#27272a" stroke-width="1"/>
    <text x="192" y="238" fill="#71717a" font-family="monospace" font-size="10">STANDARDS</text>
    <text x="192" y="258" fill="#fafafa" font-family="monospace" font-size="13" font-weight="bold">ITIL v4</text>
    <text x="192" y="276" fill="#10b981" font-family="monospace" font-size="10">SLA Enforced</text>
  </g>
</svg>
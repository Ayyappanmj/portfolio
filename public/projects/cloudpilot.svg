<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <pattern id="grid-cp" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#27272a" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="#09090b"/>
  <rect width="800" height="450" fill="url(#grid-cp)"/>
  <rect x="25" y="25" width="750" height="400" rx="14" fill="#121215" stroke="#27272a" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="25" y="25" width="750" height="42" rx="14" fill="#18181b"/>
  <circle cx="50" cy="46" r="5" fill="#3f3f46"/>
  <circle cx="66" cy="46" r="5" fill="#3f3f46"/>
  <circle cx="82" cy="46" r="5" fill="#3f3f46"/>
  <text x="105" y="50" fill="#a1a1aa" font-family="monospace" font-size="12">cloudpilot :: gitops-kubernetes :: argo-cd-sync</text>
  <rect x="625" y="35" width="135" height="22" rx="6" fill="#121215" stroke="#27272a" stroke-width="1"/>
  <text x="692" y="50" fill="#10b981" font-family="monospace" font-size="11" text-anchor="middle">● ARGO CD: SYNCED</text>

  <!-- GitOps Pipeline Bar -->
  <g transform="translate(45, 85)">
    <rect x="0" y="0" width="710" height="135" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="20" y="26" fill="#fafafa" font-family="monospace" font-size="12" font-weight="bold">CONTINUOUS DELIVERY &amp; GITOPS PIPELINE</text>
    <text x="500" y="26" fill="#71717a" font-family="monospace" font-size="11">Terraform Provisioned</text>

    <!-- Step 1: Git + Trivy -->
    <rect x="20" y="42" width="150" height="72" rx="6" fill="#09090b" stroke="#3f3f46" stroke-width="1"/>
    <text x="32" y="64" fill="#fafafa" font-family="monospace" font-size="11" font-weight="bold">GIT COMMIT</text>
    <text x="32" y="82" fill="#10b981" font-family="monospace" font-size="10">✓ Trivy Scanner</text>
    <text x="32" y="98" fill="#71717a" font-family="monospace" font-size="10">0 High/Crit CVEs</text>

    <!-- Arrow -->
    <line x1="170" y1="78" x2="195" y2="78" stroke="#52525b" stroke-width="2"/>

    <!-- Step 2: GHCR -->
    <rect x="195" y="42" width="150" height="72" rx="6" fill="#09090b" stroke="#3f3f46" stroke-width="1"/>
    <text x="207" y="64" fill="#fafafa" font-family="monospace" font-size="11" font-weight="bold">GHCR REGISTRY</text>
    <text x="207" y="82" fill="#10b981" font-family="monospace" font-size="10">Immutable Tags</text>
    <text x="207" y="98" fill="#71717a" font-family="monospace" font-size="10">sha256 digest</text>

    <!-- Arrow -->
    <line x1="345" y1="78" x2="370" y2="78" stroke="#52525b" stroke-width="2"/>

    <!-- Step 3: Argo CD -->
    <rect x="370" y="42" width="150" height="72" rx="6" fill="#09090b" stroke="#3f3f46" stroke-width="1"/>
    <text x="382" y="64" fill="#fafafa" font-family="monospace" font-size="11" font-weight="bold">ARGO CD RECON</text>
    <text x="382" y="82" fill="#10b981" font-family="monospace" font-size="10">Auto-Sync Loop</text>
    <text x="382" y="98" fill="#71717a" font-family="monospace" font-size="10">Helm Chart v2.4</text>

    <!-- Arrow -->
    <line x1="520" y1="78" x2="545" y2="78" stroke="#52525b" stroke-width="2"/>

    <!-- Step 4: K8s Cluster -->
    <rect x="545" y="42" width="145" height="72" rx="6" fill="#09090b" stroke="#3f3f46" stroke-width="1"/>
    <text x="557" y="64" fill="#fafafa" font-family="monospace" font-size="11" font-weight="bold">K8S CLUSTER</text>
    <text x="557" y="82" fill="#10b981" font-family="monospace" font-size="10">Zero Downtime</text>
    <text x="557" y="98" fill="#71717a" font-family="monospace" font-size="10">Prometheus Monitored</text>
  </g>

  <!-- Bottom Left: Infrastructure as Code -->
  <g transform="translate(45, 235)">
    <rect x="0" y="0" width="345" height="165" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="18" y="26" fill="#fafafa" font-family="monospace" font-size="12" font-weight="bold">TERRAFORM &amp; SECURITY BASELINES</text>
    <text x="18" y="44" fill="#71717a" font-family="monospace" font-size="11">Declarative Kubernetes Namespaces</text>
    <rect x="18" y="58" width="309" height="92" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
    <text x="28" y="80" fill="#10b981" font-family="monospace" font-size="10">✓ NetworkPolicy: default-deny ingress</text>
    <text x="28" y="98" fill="#10b981" font-family="monospace" font-size="10">✓ ResourceQuotas: CPU &amp; RAM caps enforced</text>
    <text x="28" y="116" fill="#10b981" font-family="monospace" font-size="10">✓ PodSecurityStandards: restricted profile</text>
    <text x="28" y="134" fill="#71717a" font-family="monospace" font-size="10">Automated failure-recovery drills verified</text>
  </g>

  <!-- Bottom Right: Observability Stack -->
  <g transform="translate(410, 235)">
    <rect x="0" y="0" width="345" height="165" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="18" y="26" fill="#fafafa" font-family="monospace" font-size="12" font-weight="bold">OBSERVABILITY &amp; METRICS</text>
    <text x="18" y="44" fill="#71717a" font-family="monospace" font-size="11">Prometheus &amp; Grafana Dashboards</text>
    <g transform="translate(18, 58)">
      <rect x="0" y="0" width="145" height="42" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
      <text x="12" y="18" fill="#71717a" font-family="monospace" font-size="9">DEPLOYMENT SPEED</text>
      <text x="12" y="34" fill="#fafafa" font-family="monospace" font-size="12" font-weight="bold">&lt; 90 Seconds</text>

      <rect x="164" y="0" width="145" height="42" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
      <text x="176" y="18" fill="#71717a" font-family="monospace" font-size="9">DRIFT DETECTION</text>
      <text x="176" y="34" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">Instant Reconcile</text>

      <rect x="0" y="50" width="145" height="42" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
      <text x="12" y="68" fill="#71717a" font-family="monospace" font-size="9">SCANNER</text>
      <text x="12" y="84" fill="#fafafa" font-family="monospace" font-size="12" font-weight="bold">Aqua Trivy</text>

      <rect x="164" y="50" width="145" height="42" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
      <text x="176" y="68" fill="#71717a" font-family="monospace" font-size="9">CLUSTER PLATFORM</text>
      <text x="176" y="84" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">Kind / K8s</text>
    </g>
  </g>
</svg>
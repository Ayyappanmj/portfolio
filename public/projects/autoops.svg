    <text x="28" y="238" fill="#71717a" font-family="monospace" font-size="10">TEST SUITE</text>
    <text x="28" y="258" fill="#fafafa" font-family="monospace" font-size="14" font-weight="bold">Pytest</text>
    <text x="28" y="276" fill="#10b981" font-family="monospace" font-size="10">CI Automated</text>

    <rect x="182" y="215" width="145" height="75" rx="6" fill="#121215" stroke="#27272a" stroke-width="1"/>
    <text x="192" y="238" fill="#71717a" font-family="monospace" font-size="10">RUNBOOKS</text>
    <text x="192" y="258" fill="#fafafa" font-family="monospace" font-size="14" font-weight="bold">Idempotent</text>
    <text x="192" y="276" fill="#10b981" font-family="monospace" font-size="10">Zero Downtime</text>

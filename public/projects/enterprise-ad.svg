    <text x="28" y="108" fill="#fafafa" font-family="monospace" font-size="10">New-ADUser -Name "John Doe" -Path $OU \</text>
    <text x="38" y="126" fill="#d4d4d8" font-family="monospace" font-size="10">  -AccountPassword $Pass -Enabled $true</text>
    <text x="28" y="148" fill="#10b981" font-family="monospace" font-size="10">✓ AGDLP: Assigned to G_Finance_RW</text>
    <text x="28" y="168" fill="#10b981" font-family="monospace" font-size="10">✓ NTFS &amp; SMB permissions inherited</text>
    <text x="28" y="188" fill="#71717a" font-family="monospace" font-size="10">Quarantine OU offboarding automated</text>
    <text x="28" y="204" fill="#71717a" font-family="monospace" font-size="10">Stale account scanner: 90-day inactivity</text>

    <!-- Stats -->
    <rect x="18" y="230" width="309" height="60" rx="6" fill="#121215" stroke="#27272a" stroke-width="1"/>
    <text x="28" y="252" fill="#71717a" font-family="monospace" font-size="10">ACCESS GOVERNANCE</text>
    <text x="28" y="272" fill="#fafafa" font-family="monospace" font-size="12" font-weight="bold">AGDLP RBAC Model</text>
    <text x="200" y="272" fill="#10b981" font-family="monospace" font-size="11">Zero Orphan ACLs</text>
  </g>

  <!-- Right: GPO Hardening & Event Diagnostics -->

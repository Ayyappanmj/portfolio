<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="agentBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0C20"/>
      <stop offset="50%" stop-color="#1B133E"/>
      <stop offset="100%" stop-color="#090615"/>
    </linearGradient>
    <linearGradient id="purplePink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <pattern id="agentGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#agentBg)"/>
  <rect width="800" height="450" fill="url(#agentGrid)"/>

  <circle cx="160" cy="140" r="140" fill="#8B5CF6" opacity="0.15" filter="blur(65px)"/>
  <circle cx="680" cy="300" r="160" fill="#EC4899" opacity="0.12" filter="blur(70px)"/>

  <!-- Outer Frame -->
  <rect x="30" y="30" width="740" height="390" rx="18" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect x="30" y="30" width="740" height="44" rx="18" fill="rgba(30, 41, 59, 0.8)"/>
  <circle cx="56" cy="52" r="6" fill="#EF4444"/>
  <circle cx="76" cy="52" r="6" fill="#F59E0B"/>
  <circle cx="96" cy="52" r="6" fill="#10B981"/>
  <text x="124" y="56" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">multi-agent-system :: langchain :: market-intelligence-agent</text>
  <rect x="620" y="42" width="130" height="22" rx="11" fill="rgba(168, 85, 247, 0.15)" stroke="#A855F7" stroke-width="1"/>
  <text x="635" y="57" fill="#C084FC" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Autonomous Flow</text>

  <!-- Left: Multi-Agent Collaboration Graph -->
  <g transform="translate(60, 95)">
    <rect x="0" y="0" width="370" height="255" rx="14" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="30" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Multi-Agent Workflow Orchestration</text>
    <text x="20" y="48" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Specialized LLM Agents with Tool Calling</text>

    <!-- Agent 1: Scraper/Extraction -->
    <rect x="25" y="65" width="135" height="60" rx="10" fill="rgba(30, 41, 59, 0.9)" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="92" y="88" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">📡 Scraper Agent</text>
    <text x="92" y="106" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Live News Ingestion</text>

    <!-- Connector to Analyzer -->
    <path d="M 160 95 L 205 95" stroke="#C084FC" stroke-width="2"/>
    <polygon points="205,92 212,95 205,98" fill="#C084FC"/>

    <!-- Agent 2: Analysis & Verification -->
    <rect x="215" y="65" width="135" height="60" rx="10" fill="rgba(46, 16, 101, 0.6)" stroke="#A855F7" stroke-width="1.2"/>
    <text x="282" y="88" fill="#C084FC" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">🧠 Analyst Agent</text>
    <text x="282" y="106" fill="#D8B4FE" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Trend &amp; Sentiment NLP</text>

    <!-- Connector down to Synthesis -->
    <path d="M 282 125 L 282 155" stroke="#EC4899" stroke-width="2"/>
    <polygon points="279,155 282,162 285,155" fill="#EC4899"/>

    <!-- Agent 3: Synthesis & Report Writer -->
    <rect x="110" y="165" width="240" height="68" rx="10" fill="rgba(80, 7, 36, 0.5)" stroke="#F43F5E" stroke-width="1.2"/>
    <text x="230" y="190" fill="#FDA4AF" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">📝 Synthesis &amp; Briefing Agent</text>
    <text x="230" y="208" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Markdown &amp; JSON Daily Market Dossier</text>
    <text x="230" y="222" fill="#34D399" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">✓ Automated Email &amp; Webhook Delivery</text>
  </g>

  <!-- Right: Generated Briefing Mockup -->
  <g transform="translate(455, 95)">
    <rect x="0" y="0" width="290" height="255" rx="14" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="28" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Daily Market Intelligence Feed</text>
    <text x="20" y="46" fill="#C084FC" font-family="system-ui, sans-serif" font-size="10">AUTONOMOUS RUN #142 • 06:00 AM UTC</text>

    <rect x="15" y="60" width="260" height="50" rx="8" fill="rgba(30, 41, 59, 0.6)"/>
    <text x="25" y="78" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">📈 Macro Tech Momentum</text>
    <text x="25" y="96" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Cloud spend rises +18% QoQ across top vendors</text>

    <rect x="15" y="120" width="260" height="50" rx="8" fill="rgba(30, 41, 59, 0.6)"/>
    <text x="25" y="138" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="11" font-weight="600">⚡ Semiconductor Sector Alert</text>
    <text x="25" y="156" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Foundry yield indicators exceed Q3 projections</text>

    <!-- Confidence tag -->
    <rect x="15" y="185" width="260" height="50" rx="8" fill="rgba(16, 185, 129, 0.12)" stroke="#10B981" stroke-width="0.8"/>
    <text x="25" y="205" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Summary Confidence: 96.4%</text>
    <text x="25" y="222" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="9">Cross-referenced against 47 verified financial feeds</text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(60, 375)">
    <rect x="0" y="0" width="95" height="26" rx="6" fill="rgba(168, 85, 247, 0.12)" stroke="#A855F7" stroke-width="1"/>
    <text x="47" y="17" fill="#C084FC" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">LangChain</text>

    <rect x="105" y="0" width="85" height="26" rx="6" fill="rgba(236, 72, 153, 0.12)" stroke="#EC4899" stroke-width="1"/>
    <text x="147" y="17" fill="#F472B6" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">CrewAI</text>

    <rect x="200" y="0" width="75" height="26" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="#38BDF8" stroke-width="1"/>
    <text x="237" y="17" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Python</text>

    <rect x="285" y="0" width="85" height="26" rx="6" fill="rgba(52, 211, 153, 0.12)" stroke="#34D399" stroke-width="1"/>
    <text x="327" y="17" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">NLP / LLMs</text>

    <rect x="380" y="0" width="95" height="26" rx="6" fill="rgba(245, 158, 11, 0.12)" stroke="#F59E0B" stroke-width="1"/>
    <text x="427" y="17" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Automations</text>
  </g>
</svg>
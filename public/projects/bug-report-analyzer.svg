<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="bugBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1726"/>
      <stop offset="50%" stop-color="#141E33"/>
      <stop offset="100%" stop-color="#090F1B"/>
    </linearGradient>
    <pattern id="bugGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bugBg)"/>
  <rect width="800" height="450" fill="url(#bugGrid)"/>

  <circle cx="160" cy="140" r="140" fill="#38BDF8" opacity="0.12" filter="blur(65px)"/>
  <circle cx="680" cy="300" r="160" fill="#F43F5E" opacity="0.12" filter="blur(70px)"/>

  <!-- Outer Frame -->
  <rect x="30" y="30" width="740" height="390" rx="18" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect x="30" y="30" width="740" height="44" rx="18" fill="rgba(30, 41, 59, 0.8)"/>
  <circle cx="56" cy="52" r="6" fill="#EF4444"/>
  <circle cx="76" cy="52" r="6" fill="#F59E0B"/>
  <circle cx="96" cy="52" r="6" fill="#10B981"/>
  <text x="124" y="56" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">bug-analyzer :: ollama-local-llm :: root-cause-investigation</text>
  <rect x="610" y="42" width="140" height="22" rx="11" fill="rgba(56, 189, 248, 0.15)" stroke="#38BDF8" stroke-width="1"/>
  <text x="625" y="57" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Jira Ticket Export</text>

  <!-- Left: Log Ingestion & Stack Trace Parsing -->
  <g transform="translate(60, 95)">
    <rect x="0" y="0" width="370" height="255" rx="14" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="30" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Application Log &amp; Traceback Parsing</text>
    <text x="20" y="48" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Automated Error Grouping &amp; Code Location Mapping</text>

    <!-- Terminal error snippet -->
    <rect x="20" y="65" width="330" height="110" rx="8" fill="rgba(3, 7, 18, 0.7)" stroke="rgba(255,255,255,0.05)"/>
    <text x="32" y="88" fill="#F87171" font-family="monospace" font-size="11">ERROR [2026-10-22 14:02:11] DatabaseSessionPool</text>
    <text x="32" y="106" fill="#CBD5E1" font-family="monospace" font-size="10">  ConnectionTimeout: Pool exhausted at max_size=20</text>
    <text x="32" y="124" fill="#94A3B8" font-family="monospace" font-size="10">  File "services/order_service.py", line 184 in checkout</text>
    <text x="32" y="142" fill="#F59E0B" font-family="monospace" font-size="10">  &gt;&gt; unclosed transaction holding connection lock</text>
    <text x="32" y="160" fill="#34D399" font-family="monospace" font-size="10">✓ Code snippet extracted: git/commit/8a9f201</text>

    <!-- Evidence vs Hypothesis badge -->
    <rect x="20" y="190" width="330" height="50" rx="8" fill="rgba(56, 189, 248, 0.1)" stroke="#38BDF8" stroke-width="0.8"/>
    <text x="32" y="210" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Local LLM Root Cause Hypothesis:</text>
    <text x="32" y="228" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10">Missing context manager in async checkout route leaks session.</text>
  </g>

  <!-- Right: Generated Jira Ticket & Pydantic Schema -->
  <g transform="translate(455, 95)">
    <rect x="0" y="0" width="290" height="255" rx="14" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="28" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Structured Jira Bug Report</text>
    <text x="20" y="46" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="10">Pydantic Output Validation Schema</text>

    <rect x="15" y="60" width="260" height="52" rx="8" fill="rgba(30, 41, 59, 0.6)"/>
    <text x="25" y="80" fill="#F87171" font-family="system-ui, sans-serif" font-size="11" font-weight="700">PROD-408: Connection Pool Leak</text>
    <text x="25" y="98" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Severity: P1 • Component: Order Service</text>

    <rect x="15" y="120" width="260" height="60" rx="8" fill="rgba(30, 41, 59, 0.6)"/>
    <text x="25" y="140" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Recommended Resolution:</text>
    <text x="25" y="158" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="10">Wrap session in `async with get_db():`</text>
    <text x="25" y="172" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Verified against Pytest regression suite</text>

    <rect x="15" y="190" width="260" height="50" rx="8" fill="rgba(16, 185, 129, 0.12)" stroke="#10B981" stroke-width="0.8"/>
    <text x="25" y="210" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Ollama Local Inference</text>
    <text x="25" y="228" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="10">Zero Data Leakage • 100% Private Run</text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(60, 375)">
    <rect x="0" y="0" width="85" height="26" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="#38BDF8" stroke-width="1"/>
    <text x="42" y="17" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Streamlit</text>

    <rect x="95" y="0" width="85" height="26" rx="6" fill="rgba(168, 85, 247, 0.12)" stroke="#A855F7" stroke-width="1"/>
    <text x="137" y="17" fill="#C084FC" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Ollama</text>

    <rect x="190" y="0" width="85" height="26" rx="6" fill="rgba(244, 63, 94, 0.12)" stroke="#F43F5E" stroke-width="1"/>
    <text x="232" y="17" fill="#F43F5E" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Pydantic</text>

    <rect x="285" y="0" width="75" height="26" rx="6" fill="rgba(52, 211, 153, 0.12)" stroke="#34D399" stroke-width="1"/>
    <text x="322" y="17" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Pytest</text>

    <rect x="370" y="0" width="75" height="26" rx="6" fill="rgba(245, 158, 11, 0.12)" stroke="#F59E0B" stroke-width="1"/>
    <text x="407" y="17" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">SQLite</text>

    <rect x="455" y="0" width="75" height="26" rx="6" fill="rgba(59, 130, 246, 0.12)" stroke="#3B82F6" stroke-width="1"/>
    <text x="492" y="17" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Docker</text>
  </g>
</svg>
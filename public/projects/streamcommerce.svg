<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <pattern id="grid-sc" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#27272a" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="#09090b"/>
  <rect width="800" height="450" fill="url(#grid-sc)"/>
  <rect x="25" y="25" width="750" height="400" rx="14" fill="#121215" stroke="#27272a" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="25" y="25" width="750" height="42" rx="14" fill="#18181b"/>
  <circle cx="50" cy="46" r="5" fill="#3f3f46"/>
  <circle cx="66" cy="46" r="5" fill="#3f3f46"/>
  <circle cx="82" cy="46" r="5" fill="#3f3f46"/>
  <text x="105" y="50" fill="#a1a1aa" font-family="monospace" font-size="12">streamcommerce :: redpanda-kafka :: pyspark-streaming</text>
  <rect x="625" y="35" width="135" height="22" rx="6" fill="#121215" stroke="#27272a" stroke-width="1"/>
  <text x="692" y="50" fill="#10b981" font-family="monospace" font-size="11" text-anchor="middle">● REAL-TIME PIPELINE</text>

  <!-- Left: Event Streaming & Deduplication -->
  <g transform="translate(45, 85)">
    <rect x="0" y="0" width="345" height="315" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="18" y="28" fill="#fafafa" font-family="monospace" font-size="13" font-weight="bold">EVENT STREAM INGESTION</text>
    <text x="18" y="48" fill="#71717a" font-family="monospace" font-size="11">Redpanda Broker · PySpark Micro-Batches</text>

    <!-- Topics Box -->
    <rect x="18" y="65" width="309" height="135" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
    <text x="28" y="88" fill="#71717a" font-family="monospace" font-size="10">KAFKA TOPICS CONSUMED:</text>
    <text x="28" y="108" fill="#fafafa" font-family="monospace" font-size="11">● orders.placed (partition: 0..3)</text>
    <text x="28" y="128" fill="#fafafa" font-family="monospace" font-size="11">● payments.captured (partition: 0..3)</text>
    <text x="28" y="148" fill="#fafafa" font-family="monospace" font-size="11">● refunds.processed (partition: 0..3)</text>
    <text x="28" y="172" fill="#10b981" font-family="monospace" font-size="10">✓ Deduplication: Bloom filter + event_id key</text>
    <text x="28" y="188" fill="#71717a" font-family="monospace" font-size="10">Invalid payloads routed to dead-letter quarantine</text>

    <rect x="18" y="215" width="309" height="75" rx="6" fill="#121215" stroke="#27272a" stroke-width="1"/>
    <text x="28" y="238" fill="#71717a" font-family="monospace" font-size="10">PROCESSING GUARANTEE</text>
    <text x="28" y="258" fill="#fafafa" font-family="monospace" font-size="13" font-weight="bold">Exactly-Once Semantics</text>
    <text x="28" y="276" fill="#10b981" font-family="monospace" font-size="10">Zero Duplicate Purchases Recorded</text>
  </g>

  <!-- Right: Star Schema Warehouse & dbt -->
  <g transform="translate(410, 85)">
    <rect x="0" y="0" width="345" height="315" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="18" y="28" fill="#fafafa" font-family="monospace" font-size="13" font-weight="bold">DUCKDB STAR SCHEMA</text>
    <text x="18" y="48" fill="#71717a" font-family="monospace" font-size="11">dbt Core Dimensional Modeling &amp; Analytics</text>

    <!-- Schema Tree Box -->
    <rect x="18" y="65" width="309" height="135" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
    <text x="28" y="88" fill="#fafafa" font-family="monospace" font-size="11" font-weight="bold">FACT: fact_ecommerce_orders</text>
    <text x="38" y="106" fill="#a1a1aa" font-family="monospace" font-size="10">├── dim_customer (SCD Type 2)</text>
    <text x="38" y="124" fill="#a1a1aa" font-family="monospace" font-size="10">├── dim_product (SKU, Category, Margin)</text>
    <text x="38" y="142" fill="#a1a1aa" font-family="monospace" font-size="10">└── dim_date (Fiscal Year, Quarter)</text>
    <text x="28" y="165" fill="#10b981" font-family="monospace" font-size="10">dbt models: Customer Lifetime Value (CLV)</text>
    <text x="28" y="185" fill="#71717a" font-family="monospace" font-size="10">Cohort Retention · Cart Abandonment Rates</text>

    <!-- Streamlit UI Box -->
    <rect x="18" y="215" width="309" height="75" rx="6" fill="#121215" stroke="#27272a" stroke-width="1"/>
    <text x="28" y="238" fill="#71717a" font-family="monospace" font-size="10">DASHBOARD &amp; ORCHESTRATION</text>
    <text x="28" y="258" fill="#fafafa" font-family="monospace" font-size="13" font-weight="bold">Multi-Page Streamlit App</text>
    <text x="28" y="276" fill="#10b981" font-family="monospace" font-size="10">Airflow Scheduled Micro-DAGs</text>
  </g>
</svg>
    <rect x="18" y="215" width="145" height="75" rx="6" fill="#121215" stroke="#27272a" stroke-width="1"/>
    <text x="28" y="238" fill="#71717a" font-family="monospace" font-size="10">FRONTEND</text>
    <text x="28" y="258" fill="#fafafa" font-family="monospace" font-size="13" font-weight="bold">Flutter + Next</text>
    <text x="28" y="276" fill="#10b981" font-family="monospace" font-size="10">Offline First</text>

    <rect x="182" y="215" width="145" height="75" rx="6" fill="#121215" stroke="#27272a" stroke-width="1"/>
    <text x="192" y="238" fill="#71717a" font-family="monospace" font-size="10">PROCESSING</text>
    <text x="192" y="258" fill="#fafafa" font-family="monospace" font-size="13" font-weight="bold">Celery Redis</text>
    <text x="192" y="276" fill="#10b981" font-family="monospace" font-size="10">Async Workers</text>

    <text x="28" y="108" fill="#fafafa" font-family="monospace" font-size="11">1. BilateralFilter + Otsu thresholding</text>
    <text x="28" y="126" fill="#fafafa" font-family="monospace" font-size="11">2. Perspective warp &amp; edge bounding</text>
    <text x="28" y="146" fill="#10b981" font-family="monospace" font-size="10">PARSED EXTRACTED ENTITIES:</text>
    <text x="38" y="164" fill="#fafafa" font-family="monospace" font-size="10">Vendor: Apple Store · Total: $1,299.00</text>
    <text x="38" y="180" fill="#fafafa" font-family="monospace" font-size="10">Warranty End: 2027-11-20 · Tax: $103.92</text>
    <text x="28" y="202" fill="#71717a" font-family="monospace" font-size="10">FastAPI async Celery task queue</text>

    <rect x="18" y="230" width="309" height="60" rx="6" fill="#121215" stroke="#27272a" stroke-width="1"/>
    <text x="28" y="252" fill="#71717a" font-family="monospace" font-size="10">OCR ACCURACY</text>
    <text x="28" y="272" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">94.8% Field Extraction Precision</text>

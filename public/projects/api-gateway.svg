<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D1A"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#050B14"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Glowing Orbs -->
  <circle cx="150" cy="120" r="140" fill="#06B6D4" opacity="0.12" filter="blur(60px)"/>
  <circle cx="680" cy="300" r="160" fill="#8B5CF6" opacity="0.12" filter="blur(70px)"/>

  <!-- Outer Card Frame -->
  <rect x="30" y="30" width="740" height="390" rx="18" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect x="30" y="30" width="740" height="44" rx="18" fill="rgba(30, 41, 59, 0.8)"/>
  <circle cx="56" cy="52" r="6" fill="#EF4444"/>
  <circle cx="76" cy="52" r="6" fill="#F59E0B"/>
  <circle cx="96" cy="52" r="6" fill="#10B981"/>
  <text x="124" y="56" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">api-gateway :: token-bucket :: redis-lua</text>
  <rect x="630" y="42" width="120" height="22" rx="11" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="1"/>
  <text x="650" y="57" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">85 Tests Passed</text>

  <!-- Left Side: Gateway Architecture Diagram -->
  <g transform="translate(60, 100)">
    <!-- Incoming Request -->
    <rect x="0" y="35" width="120" height="50" rx="10" fill="rgba(30, 41, 59, 0.9)" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="60" y="58" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Client App</text>
    <text x="60" y="74" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">React / TS</text>

    <!-- Arrow 1 -->
    <path d="M 120 60 L 165 60" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="165,57 172,60 165,63" fill="#38BDF8"/>

    <!-- Gateway Core -->
    <rect x="175" y="10" width="170" height="100" rx="12" fill="rgba(15, 23, 42, 0.95)" stroke="url(#cyanGrad)" stroke-width="2"/>
    <text x="260" y="38" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">FastAPI Gateway</text>
    <text x="260" y="58" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">• JWT / RBAC Auth</text>
    <text x="260" y="76" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">• Request Routing</text>
    <text x="260" y="94" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">• Central Error Handler</text>

    <!-- Arrow down to Redis -->
    <path d="M 260 110 L 260 155" stroke="#A855F7" stroke-width="2"/>
    <polygon points="257,155 260,162 263,155" fill="#A855F7"/>

    <!-- Redis Lua Rate Limiter -->
    <rect x="175" y="165" width="170" height="85" rx="12" fill="rgba(30, 27, 75, 0.85)" stroke="#A855F7" stroke-width="1.5"/>
    <text x="260" y="192" fill="#C084FC" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Redis Token Bucket</text>
    <text x="260" y="212" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Atomic Lua Script</text>
    <text x="260" y="230" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Zero Race Conditions</text>

    <!-- Arrow to Postgres -->
    <path d="M 345 60 L 390 60" stroke="#34D399" stroke-width="2"/>
    <polygon points="390,57 397,60 390,63" fill="#34D399"/>

    <!-- PostgreSQL DB -->
    <rect x="400" y="20" width="130" height="80" rx="10" fill="rgba(6, 78, 59, 0.4)" stroke="#10B981" stroke-width="1.5"/>
    <text x="465" y="48" fill="#34D399" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">PostgreSQL</text>
    <text x="465" y="68" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">7 Normalized Tables</text>
    <text x="465" y="84" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Alembic Migrations</text>
  </g>

  <!-- Right Side: Metrics & Analytics Panel -->
  <g transform="translate(615, 105)">
    <rect x="0" y="0" width="135" height="70" rx="10" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(255,255,255,0.08)"/>
    <text x="16" y="24" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" font-weight="500">P99 LATENCY</text>
    <text x="16" y="52" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="22" font-weight="700">12 ms</text>

    <rect x="0" y="82" width="135" height="70" rx="10" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(255,255,255,0.08)"/>
    <text x="16" y="106" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" font-weight="500">RATE LIMIT</text>
    <text x="16" y="134" fill="#C084FC" font-family="system-ui, sans-serif" font-size="20" font-weight="700">100 req/s</text>

    <rect x="0" y="164" width="135" height="70" rx="10" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(255,255,255,0.08)"/>
    <text x="16" y="188" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" font-weight="500">DOCKER STACK</text>
    <text x="16" y="214" fill="#34D399" font-family="system-ui, sans-serif" font-size="14" font-weight="700">4 Containers</text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(60, 375)">
    <rect x="0" y="0" width="85" height="26" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="#38BDF8" stroke-width="1"/>
    <text x="42" y="17" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">FastAPI</text>

    <rect x="95" y="0" width="95" height="26" rx="6" fill="rgba(192, 132, 252, 0.12)" stroke="#C084FC" stroke-width="1"/>
    <text x="142" y="17" fill="#C084FC" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Redis + Lua</text>

    <rect x="200" y="0" width="95" height="26" rx="6" fill="rgba(52, 211, 153, 0.12)" stroke="#34D399" stroke-width="1"/>
    <text x="247" y="17" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">PostgreSQL</text>

    <rect x="305" y="0" width="85" height="26" rx="6" fill="rgba(251, 146, 60, 0.12)" stroke="#FB923C" stroke-width="1"/>
    <text x="347" y="17" fill="#FB923C" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Docker</text>

    <rect x="400" y="0" width="95" height="26" rx="6" fill="rgba(244, 63, 94, 0.12)" stroke="#F43F5E" stroke-width="1"/>
    <text x="447" y="17" fill="#F43F5E" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">TypeScript</text>
  </g>
</svg>
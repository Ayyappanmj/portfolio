<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <pattern id="grid-dt" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#27272a" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="#09090b"/>
  <rect width="800" height="450" fill="url(#grid-dt)"/>
  <rect x="25" y="25" width="750" height="400" rx="14" fill="#121215" stroke="#27272a" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="25" y="25" width="750" height="42" rx="14" fill="#18181b"/>
  <circle cx="50" cy="46" r="5" fill="#3f3f46"/>
  <circle cx="66" cy="46" r="5" fill="#3f3f46"/>
  <circle cx="82" cy="46" r="5" fill="#3f3f46"/>
  <text x="105" y="50" fill="#a1a1aa" font-family="monospace" font-size="12">datatrust :: lakehouse-engine :: bronze-silver-gold</text>
  <rect x="625" y="35" width="135" height="22" rx="6" fill="#121215" stroke="#27272a" stroke-width="1"/>
  <text x="692" y="50" fill="#10b981" font-family="monospace" font-size="11" text-anchor="middle">● AIRFLOW: 11-TASK DAG</text>

  <!-- 3-Tier Medallion Layer -->
  <g transform="translate(45, 85)">
    <rect x="0" y="0" width="710" height="150" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="20" y="26" fill="#fafafa" font-family="monospace" font-size="12" font-weight="bold">MEDALLION ARCHITECTURE (NYC TLC PARQUET)</text>
    <text x="510" y="26" fill="#71717a" font-family="monospace" font-size="11">SHA-256 Partition Swaps</text>

    <!-- Bronze -->
    <rect x="20" y="42" width="210" height="90" rx="6" fill="#09090b" stroke="#3f3f46" stroke-width="1"/>
    <text x="32" y="64" fill="#a1a1aa" font-family="monospace" font-size="11">BRONZE LAYER (RAW)</text>
    <text x="32" y="84" fill="#fafafa" font-family="monospace" font-size="12" font-weight="bold">PySpark Ingestion</text>
    <text x="32" y="104" fill="#71717a" font-family="monospace" font-size="10">NYC TLC Trip Data · Parquet</text>
    <text x="32" y="120" fill="#10b981" font-family="monospace" font-size="10">SHA-256 Checksum Gate</text>

    <!-- Arrow -->
    <line x1="230" y1="87" x2="255" y2="87" stroke="#52525b" stroke-width="2"/>

    <!-- Silver -->
    <rect x="255" y="42" width="210" height="90" rx="6" fill="#09090b" stroke="#3f3f46" stroke-width="1"/>
    <text x="267" y="64" fill="#a1a1aa" font-family="monospace" font-size="11">SILVER LAYER (CLEANED)</text>
    <text x="267" y="84" fill="#fafafa" font-family="monospace" font-size="12" font-weight="bold">Pandera Schema Gate</text>
    <text x="267" y="104" fill="#eab308" font-family="monospace" font-size="10">Quarantine Invalid Records</text>
    <text x="267" y="120" fill="#10b981" font-family="monospace" font-size="10">Type &amp; Range Checks</text>

    <!-- Arrow -->
    <line x1="465" y1="87" x2="490" y2="87" stroke="#52525b" stroke-width="2"/>

    <!-- Gold -->
    <rect x="490" y="42" width="200" height="90" rx="6" fill="#09090b" stroke="#3f3f46" stroke-width="1"/>
    <text x="502" y="64" fill="#a1a1aa" font-family="monospace" font-size="11">GOLD LAYER (ANALYTICS)</text>
    <text x="502" y="84" fill="#fafafa" font-family="monospace" font-size="12" font-weight="bold">DuckDB + dbt Core</text>
    <text x="502" y="104" fill="#71717a" font-family="monospace" font-size="10">Dimensional Data Marts</text>
    <text x="502" y="120" fill="#10b981" font-family="monospace" font-size="10">Streamlit Visual Lineage</text>
  </g>

  <!-- Bottom Left: Pandera Quality Gates -->
  <g transform="translate(45, 250)">
    <rect x="0" y="0" width="345" height="150" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="18" y="26" fill="#fafafa" font-family="monospace" font-size="12" font-weight="bold">DATA QUALITY ENFORCEMENT</text>
    <rect x="18" y="42" width="309" height="92" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
    <text x="28" y="64" fill="#10b981" font-family="monospace" font-size="10">✓ trip_distance: Check.greater_than(0.0)</text>
    <text x="28" y="82" fill="#10b981" font-family="monospace" font-size="10">✓ fare_amount: Check.in_range(2.5, 1000.0)</text>
    <text x="28" y="100" fill="#10b981" font-family="monospace" font-size="10">✓ passenger_count: nullable=False, ge=1</text>
    <text x="28" y="118" fill="#71717a" font-family="monospace" font-size="10">Atomic journalled partition swap on success</text>
  </g>

  <!-- Bottom Right: dbt & Lineage Metrics -->
  <g transform="translate(410, 250)">
    <rect x="0" y="0" width="345" height="150" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="18" y="26" fill="#fafafa" font-family="monospace" font-size="12" font-weight="bold">ANALYTICS ENGINE</text>
    <g transform="translate(18, 42)">
      <rect x="0" y="0" width="145" height="42" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
      <text x="12" y="18" fill="#71717a" font-family="monospace" font-size="9">STORAGE FORMAT</text>
      <text x="12" y="34" fill="#fafafa" font-family="monospace" font-size="12" font-weight="bold">Parquet + Snappy</text>

      <rect x="164" y="0" width="145" height="42" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
      <text x="176" y="18" fill="#71717a" font-family="monospace" font-size="9">QUERY ENGINE</text>
      <text x="176" y="34" fill="#fafafa" font-family="monospace" font-size="12" font-weight="bold">DuckDB In-Process</text>

      <rect x="0" y="50" width="145" height="42" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
      <text x="12" y="68" fill="#71717a" font-family="monospace" font-size="9">TRANSFORMATIONS</text>
      <text x="12" y="84" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">dbt Core Models</text>

      <rect x="164" y="50" width="145" height="42" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
      <text x="176" y="68" fill="#71717a" font-family="monospace" font-size="9">ORCHESTRATOR</text>
      <text x="176" y="84" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">Apache Airflow</text>
    </g>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="shBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081A1B"/>
      <stop offset="50%" stop-color="#0F2B2D"/>
      <stop offset="100%" stop-color="#051012"/>
    </linearGradient>
    <linearGradient id="healGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <pattern id="shGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#shBg)"/>
  <rect width="800" height="450" fill="url(#shGrid)"/>

  <circle cx="160" cy="140" r="140" fill="#10B981" opacity="0.12" filter="blur(65px)"/>
  <circle cx="680" cy="300" r="160" fill="#06B6D4" opacity="0.12" filter="blur(70px)"/>

  <!-- Outer Frame -->
  <rect x="30" y="30" width="740" height="390" rx="18" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect x="30" y="30" width="740" height="44" rx="18" fill="rgba(30, 41, 59, 0.8)"/>
  <circle cx="56" cy="52" r="6" fill="#EF4444"/>
  <circle cx="76" cy="52" r="6" fill="#F59E0B"/>
  <circle cx="96" cy="52" r="6" fill="#10B981"/>
  <text x="124" y="56" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">self-healing-agent :: playwright-dom-inspection :: auto-healing</text>
  <rect x="590" y="42" width="160" height="22" rx="11" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="1"/>
  <text x="605" y="57" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Dynamic Healed 100%</text>

  <!-- Left: DOM Tree & Selector Healing Workflow -->
  <g transform="translate(60, 95)">
    <rect x="0" y="0" width="370" height="255" rx="14" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="30" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700">DOM Locator Healing Process</text>
    <text x="20" y="48" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Detects Stale Selectors &amp; Re-Anchors Actions</text>

    <!-- Failed Locator Card -->
    <rect x="20" y="65" width="330" height="42" rx="8" fill="rgba(239, 68, 68, 0.12)" stroke="#EF4444" stroke-width="1"/>
    <text x="32" y="84" fill="#FCA5A5" font-family="monospace" font-size="11">❌ Target: button#submit-v2</text>
    <text x="32" y="99" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Status: Playwright LocatorTimeout (Element not found)</text>

    <!-- Healing Logic / DOM Inspection -->
    <rect x="20" y="115" width="330" height="52" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(255,255,255,0.05)"/>
    <text x="32" y="134" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="10" font-weight="600">🔍 DOM Tree Scoring Heuristics:</text>
    <text x="32" y="150" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Match attributes, text="Confirm", aria-label, tree proximity</text>
    <text x="32" y="163" fill="#C084FC" font-family="system-ui, sans-serif" font-size="9">Optional Ollama LLM Fallback for ambiguous structures</text>

    <!-- Healed Selector Card -->
    <rect x="20" y="175" width="330" height="65" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="1.2"/>
    <text x="32" y="196" fill="#34D399" font-family="monospace" font-size="11" font-weight="700">✓ Replacement: button[data-testid="checkout-btn"]</text>
    <text x="32" y="214" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="10">Confidence Score: 0.98 • Auto-retried in 240ms</text>
    <text x="32" y="230" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="9">Test Execution Succeeded • Healing Log Persisted</text>
  </g>

  <!-- Right: Healing Metrics & SQLite Log Panel -->
  <g transform="translate(455, 95)">
    <rect x="0" y="0" width="290" height="255" rx="14" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="28" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Streamlit Recovery Console</text>
    <text x="20" y="46" fill="#10B981" font-family="system-ui, sans-serif" font-size="10">REAL-TIME PLAYWRIGHT OBSERVER</text>

    <rect x="15" y="60" width="125" height="55" rx="8" fill="rgba(30, 41, 59, 0.6)"/>
    <text x="27" y="80" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">ACTIONS RECOVERED</text>
    <text x="27" y="104" fill="#34D399" font-family="system-ui, sans-serif" font-size="18" font-weight="700">98.4%</text>

    <rect x="150" y="60" width="125" height="55" rx="8" fill="rgba(30, 41, 59, 0.6)"/>
    <text x="162" y="80" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">RECOVERY TIME</text>
    <text x="162" y="104" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="18" font-weight="700">&lt; 350ms</text>

    <rect x="15" y="125" width="260" height="115" rx="8" fill="rgba(30, 41, 59, 0.6)"/>
    <text x="25" y="145" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11" font-weight="600">SQLite Structured Event Log</text>
    <text x="25" y="165" fill="#94A3B8" font-family="monospace" font-size="9">• test_checkout_flow: selector healed</text>
    <text x="25" y="180" fill="#94A3B8" font-family="monospace" font-size="9">• test_user_nav: aria-label rebound</text>
    <text x="25" y="195" fill="#94A3B8" font-family="monospace" font-size="9">• test_cart_modal: text heuristic passed</text>
    <text x="25" y="215" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="10">✓ Pytest Test Suite Continues Unbroken</text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(60, 375)">
    <rect x="0" y="0" width="95" height="26" rx="6" fill="rgba(16, 185, 129, 0.12)" stroke="#10B981" stroke-width="1"/>
    <text x="47" y="17" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Playwright</text>

    <rect x="105" y="0" width="85" height="26" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="#38BDF8" stroke-width="1"/>
    <text x="147" y="17" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Streamlit</text>

    <rect x="200" y="0" width="85" height="26" rx="6" fill="rgba(168, 85, 247, 0.12)" stroke="#A855F7" stroke-width="1"/>
    <text x="242" y="17" fill="#C084FC" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Ollama</text>

    <rect x="295" y="0" width="75" height="26" rx="6" fill="rgba(244, 63, 94, 0.12)" stroke="#F43F5E" stroke-width="1"/>
    <text x="332" y="17" fill="#F43F5E" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Pytest</text>

    <rect x="380" y="0" width="75" height="26" rx="6" fill="rgba(245, 158, 11, 0.12)" stroke="#F59E0B" stroke-width="1"/>
    <text x="417" y="17" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">SQLite</text>

    <rect x="465" y="0" width="75" height="26" rx="6" fill="rgba(59, 130, 246, 0.12)" stroke="#3B82F6" stroke-width="1"/>
    <text x="502" y="17" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Python</text>
  </g>
</svg>
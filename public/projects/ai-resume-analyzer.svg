<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="resBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1626"/>
      <stop offset="50%" stop-color="#18233C"/>
      <stop offset="100%" stop-color="#0A101C"/>
    </linearGradient>
    <pattern id="resGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#resBg)"/>
  <rect width="800" height="450" fill="url(#resGrid)"/>

  <circle cx="160" cy="140" r="140" fill="#3B82F6" opacity="0.12" filter="blur(65px)"/>
  <circle cx="680" cy="300" r="160" fill="#10B981" opacity="0.12" filter="blur(70px)"/>

  <!-- Outer Frame -->
  <rect x="30" y="30" width="740" height="390" rx="18" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect x="30" y="30" width="740" height="44" rx="18" fill="rgba(30, 41, 59, 0.8)"/>
  <circle cx="56" cy="52" r="6" fill="#EF4444"/>
  <circle cx="76" cy="52" r="6" fill="#F59E0B"/>
  <circle cx="96" cy="52" r="6" fill="#10B981"/>
  <text x="124" y="56" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">resume-analyzer :: nlp-parser :: ats-scoring-engine</text>
  <rect x="620" y="42" width="130" height="22" rx="11" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="1"/>
  <text x="635" y="57" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">88% ATS Score</text>

  <!-- Left: Resume Parser & Extraction Visual -->
  <g transform="translate(60, 95)">
    <rect x="0" y="0" width="370" height="255" rx="14" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="30" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700">NLP Document Ingestion &amp; Entity Extraction</text>
    <text x="20" y="48" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">PDF/DOCX Parsing • spaCy &amp; TF-IDF Analysis</text>

    <!-- Extracted Skills Tags -->
    <rect x="20" y="65" width="330" height="75" rx="8" fill="rgba(30, 41, 59, 0.6)"/>
    <text x="32" y="85" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Matched Skills &amp; Qualifications:</text>
    
    <!-- Pills -->
    <rect x="32" y="95" width="60" height="22" rx="4" fill="rgba(56, 189, 248, 0.2)"/>
    <text x="62" y="110" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Python</text>

    <rect x="98" y="95" width="60" height="22" rx="4" fill="rgba(56, 189, 248, 0.2)"/>
    <text x="128" y="110" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">FastAPI</text>

    <rect x="164" y="95" width="55" height="22" rx="4" fill="rgba(56, 189, 248, 0.2)"/>
    <text x="191" y="110" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Docker</text>

    <rect x="225" y="95" width="50" height="22" rx="4" fill="rgba(56, 189, 248, 0.2)"/>
    <text x="250" y="110" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Redis</text>

    <rect x="281" y="95" width="55" height="22" rx="4" fill="rgba(56, 189, 248, 0.2)"/>
    <text x="308" y="110" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Pytest</text>

    <!-- Missing Keywords / Skill Gap Warning -->
    <rect x="20" y="150" width="330" height="85" rx="8" fill="rgba(245, 158, 11, 0.12)" stroke="#F59E0B" stroke-width="0.8"/>
    <text x="32" y="172" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="11" font-weight="600">⚡ Keyword Gap &amp; Optimization Feedback:</text>
    <text x="32" y="192" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10">Missing Target Terms: [Kafka, Kubernetes, GraphQL]</text>
    <text x="32" y="210" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Add quantifiable metrics in Experience section for +12% ATS boost</text>
  </g>

  <!-- Right: ATS Match Gauge & Scoring Cards -->
  <g transform="translate(455, 95)">
    <rect x="0" y="0" width="290" height="255" rx="14" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="28" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700">ATS Match Scoring Engine</text>
    <text x="20" y="46" fill="#34D399" font-family="system-ui, sans-serif" font-size="10">TF-IDF COSINE SIMILARITY &amp; LLM EVAL</text>

    <rect x="15" y="60" width="125" height="55" rx="8" fill="rgba(30, 41, 59, 0.6)"/>
    <text x="27" y="80" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">OVERALL FIT</text>
    <text x="27" y="104" fill="#34D399" font-family="system-ui, sans-serif" font-size="18" font-weight="700">88.2%</text>

    <rect x="150" y="60" width="125" height="55" rx="8" fill="rgba(30, 41, 59, 0.6)"/>
    <text x="162" y="80" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">SKILL RELEVANCE</text>
    <text x="162" y="104" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="18" font-weight="700">92.0%</text>

    <rect x="15" y="125" width="260" height="115" rx="8" fill="rgba(30, 41, 59, 0.6)"/>
    <text x="25" y="145" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Structured Section Scores</text>
    <text x="25" y="165" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">• Education &amp; Certifications: 95%</text>
    <text x="25" y="185" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">• Technical Skills Depth: 91%</text>
    <text x="25" y="205" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">• Project Impact Quantification: 84%</text>
    <text x="25" y="225" fill="#34D399" font-family="system-ui, sans-serif" font-size="10">✓ Streamlit Interactive Dashboard Live</text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(60, 375)">
    <rect x="0" y="0" width="85" height="26" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="#38BDF8" stroke-width="1"/>
    <text x="42" y="17" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">FastAPI</text>

    <rect x="95" y="0" width="85" height="26" rx="6" fill="rgba(16, 185, 129, 0.12)" stroke="#10B981" stroke-width="1"/>
    <text x="137" y="17" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Streamlit</text>

    <rect x="190" y="0" width="75" height="26" rx="6" fill="rgba(168, 85, 247, 0.12)" stroke="#A855F7" stroke-width="1"/>
    <text x="227" y="17" fill="#C084FC" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">spaCy</text>

    <rect x="275" y="0" width="95" height="26" rx="6" fill="rgba(245, 158, 11, 0.12)" stroke="#F59E0B" stroke-width="1"/>
    <text x="322" y="17" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">TF-IDF</text>

    <rect x="380" y="0" width="85" height="26" rx="6" fill="rgba(244, 63, 94, 0.12)" stroke="#F43F5E" stroke-width="1"/>
    <text x="422" y="17" fill="#F43F5E" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Ollama</text>

    <rect x="475" y="0" width="75" height="26" rx="6" fill="rgba(59, 130, 246, 0.12)" stroke="#3B82F6" stroke-width="1"/>
    <text x="512" y="17" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Python</text>
  </g>
</svg>
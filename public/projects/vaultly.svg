    <text x="28" y="88" fill="#fafafa" font-family="monospace" font-size="11" font-weight="bold">HOUSEHOLD EXPENSE SPLITTING</text>
    <text x="28" y="110" fill="#10b981" font-family="monospace" font-size="10">✓ Largest Remainder algorithm: zero-penny drift</text>

    <text x="28" y="110" fill="#10b981" font-family="monospace" font-size="10">✓ Event ID 4740: Account lockout root cause</text>
    <text x="28" y="128" fill="#10b981" font-family="monospace" font-size="10">✓ Event ID 4625: Brute-force failed logon</text>
    <text x="28" y="146" fill="#10b981" font-family="monospace" font-size="10">✓ Secure Channel: nltest broken trust repair</text>
    <text x="28" y="164" fill="#10b981" font-family="monospace" font-size="10">✓ DNS SRV Records: _ldap._tcp verification</text>
    <text x="28" y="185" fill="#71717a" font-family="monospace" font-size="10">GPO: LAPS enabled · SMBv1 disabled</text>

    <!-- Metrics -->
    <rect x="18" y="215" width="145" height="75" rx="6" fill="#121215" stroke="#27272a" stroke-width="1"/>
    <text x="28" y="238" fill="#71717a" font-family="monospace" font-size="10">OS PLATFORM</text>
    <text x="28" y="258" fill="#fafafa" font-family="monospace" font-size="13" font-weight="bold">WS 2022</text>
    <text x="28" y="276" fill="#10b981" font-family="monospace" font-size="10">AD DS Domain</text>

    <rect x="182" y="215" width="145" height="75" rx="6" fill="#121215" stroke="#27272a" stroke-width="1"/>
    <text x="192" y="238" fill="#71717a" font-family="monospace" font-size="10">RUNBOOKS</text>
    <text x="192" y="258" fill="#fafafa" font-family="monospace" font-size="13" font-weight="bold">10 Scenarios</text>
    <text x="192" y="276" fill="#10b981" font-family="monospace" font-size="10">SOP Verified</text>

    <text x="28" y="128" fill="#10b981" font-family="monospace" font-size="10">ok: [prod-srv-01] =&gt; SSH root login disabled</text>
    <text x="28" y="146" fill="#10b981" font-family="monospace" font-size="10">ok: [prod-srv-01] =&gt; UFW baseline: 22, 443 only</text>

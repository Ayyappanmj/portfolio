<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="churnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1220"/>
      <stop offset="50%" stop-color="#151C33"/>
      <stop offset="100%" stop-color="#080A12"/>
    </linearGradient>
    <pattern id="churnGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#churnBg)"/>
  <rect width="800" height="450" fill="url(#churnGrid)"/>

  <circle cx="160" cy="140" r="140" fill="#3B82F6" opacity="0.12" filter="blur(65px)"/>
  <circle cx="680" cy="300" r="160" fill="#F59E0B" opacity="0.12" filter="blur(70px)"/>

  <!-- Outer Frame -->
  <rect x="30" y="30" width="740" height="390" rx="18" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect x="30" y="30" width="740" height="44" rx="18" fill="rgba(30, 41, 59, 0.8)"/>
  <circle cx="56" cy="52" r="6" fill="#EF4444"/>
  <circle cx="76" cy="52" r="6" fill="#F59E0B"/>
  <circle cx="96" cy="52" r="6" fill="#10B981"/>
  <text x="124" y="56" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">churn-analytics :: 41-sql-queries :: 33-pytest-validations</text>
  <rect x="610" y="42" width="140" height="22" rx="11" fill="rgba(245, 158, 11, 0.15)" stroke="#F59E0B" stroke-width="1"/>
  <text x="625" y="57" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="11" font-weight="600">3-Page Power BI</text>

  <!-- Left: Cohort Retention & Churn Curve -->
  <g transform="translate(60, 95)">
    <rect x="0" y="0" width="370" height="255" rx="14" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="30" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Cohort Churn &amp; Retention Heatmap</text>
    <text x="20" y="48" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">5,000 Customers • Concentrated 1-3 Month Churn (6.2%/mo)</text>

    <!-- Cohort Grid Heatmap Mockup -->
    <g transform="translate(20, 65)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="70" height="26" rx="4" fill="rgba(59, 130, 246, 0.7)"/>
      <text x="35" y="17" fill="#FFF" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">100%</text>

      <rect x="75" y="0" width="70" height="26" rx="4" fill="rgba(59, 130, 246, 0.5)"/>
      <text x="110" y="17" fill="#FFF" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">93.8%</text>

      <rect x="150" y="0" width="70" height="26" rx="4" fill="rgba(59, 130, 246, 0.35)"/>
      <text x="185" y="17" fill="#FFF" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">87.6%</text>

      <rect x="225" y="0" width="70" height="26" rx="4" fill="rgba(59, 130, 246, 0.2)"/>
      <text x="260" y="17" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">82.1%</text>

      <!-- Row 2 -->
      <rect x="0" y="32" width="70" height="26" rx="4" fill="rgba(59, 130, 246, 0.7)"/>
      <text x="35" y="49" fill="#FFF" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">100%</text>

      <rect x="75" y="32" width="70" height="26" rx="4" fill="rgba(59, 130, 246, 0.48)"/>
      <text x="110" y="49" fill="#FFF" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">92.9%</text>

      <rect x="150" y="32" width="70" height="26" rx="4" fill="rgba(59, 130, 246, 0.3)"/>
      <text x="185" y="49" fill="#FFF" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">85.4%</text>

      <rect x="225" y="32" width="70" height="26" rx="4" fill="rgba(244, 63, 94, 0.25)"/>
      <text x="260" y="49" fill="#FDA4AF" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">79.8%</text>
    </g>

    <!-- Key insight box -->
    <rect x="20" y="140" width="330" height="95" rx="8" fill="rgba(3, 7, 18, 0.6)" stroke="rgba(255,255,255,0.05)"/>
    <text x="32" y="162" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Key Analytical Findings (41 SQL Queries):</text>
    <text x="32" y="180" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10">• Churn heavily concentrated in Basic tier &amp; Affiliate channel</text>
    <text x="32" y="196" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10">• Customers adopting &gt;2 features exhibit 4.2x longer retention</text>
    <text x="32" y="214" fill="#34D399" font-family="system-ui, sans-serif" font-size="10">✓ 33 Automated Pytest suites validated churn logic &amp; revenue</text>
  </g>

  <!-- Right: Power BI 3-Page Executive Highlights -->
  <g transform="translate(455, 95)">
    <rect x="0" y="0" width="290" height="255" rx="14" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="28" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Executive Power BI Suite</text>
    <text x="20" y="46" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="10">INTERACTIVE DAX MEASURES</text>

    <rect x="15" y="60" width="125" height="55" rx="8" fill="rgba(30, 41, 59, 0.6)"/>
    <text x="27" y="80" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">MONTHLY CHURN</text>
    <text x="27" y="104" fill="#F87171" font-family="system-ui, sans-serif" font-size="18" font-weight="700">6.2%</text>

    <rect x="150" y="60" width="125" height="55" rx="8" fill="rgba(30, 41, 59, 0.6)"/>
    <text x="162" y="80" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">AVG CLV</text>
    <text x="162" y="104" fill="#34D399" font-family="system-ui, sans-serif" font-size="18" font-weight="700">$1,420</text>

    <rect x="15" y="125" width="260" height="115" rx="8" fill="rgba(30, 41, 59, 0.6)"/>
    <text x="25" y="145" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11" font-weight="600">3-Page Dashboard Sections:</text>
    <text x="25" y="165" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">1. Executive Overview &amp; Revenue Metrics</text>
    <text x="25" y="185" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">2. Customer Retention &amp; Support Correlation</text>
    <text x="25" y="205" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">3. Customer Lifetime Value (CLV) &amp; Cohorts</text>
    <text x="25" y="225" fill="#34D399" font-family="system-ui, sans-serif" font-size="10">✓ SQLite ETL Data Modeling Complete</text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(60, 375)">
    <rect x="0" y="0" width="85" height="26" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="#38BDF8" stroke-width="1"/>
    <text x="42" y="17" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">SQLite</text>

    <rect x="95" y="0" width="85" height="26" rx="6" fill="rgba(245, 158, 11, 0.12)" stroke="#F59E0B" stroke-width="1"/>
    <text x="137" y="17" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Power BI</text>

    <rect x="190" y="0" width="75" height="26" rx="6" fill="rgba(52, 211, 153, 0.12)" stroke="#34D399" stroke-width="1"/>
    <text x="227" y="17" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Pytest</text>

    <rect x="275" y="0" width="85" height="26" rx="6" fill="rgba(59, 130, 246, 0.12)" stroke="#3B82F6" stroke-width="1"/>
    <text x="317" y="17" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Pandas</text>

    <rect x="370" y="0" width="95" height="26" rx="6" fill="rgba(192, 132, 252, 0.12)" stroke="#C084FC" stroke-width="1"/>
    <text x="417" y="17" fill="#C084FC" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Advanced SQL</text>

    <rect x="475" y="0" width="75" height="26" rx="6" fill="rgba(244, 63, 94, 0.12)" stroke="#F43F5E" stroke-width="1"/>
    <text x="512" y="17" fill="#F43F5E" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Python</text>
  </g>
</svg>
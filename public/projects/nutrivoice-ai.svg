<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <pattern id="grid-nv" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#27272a" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="#09090b"/>
  <rect width="800" height="450" fill="url(#grid-nv)"/>
  <rect x="25" y="25" width="750" height="400" rx="14" fill="#121215" stroke="#27272a" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="25" y="25" width="750" height="42" rx="14" fill="#18181b"/>
  <circle cx="50" cy="46" r="5" fill="#3f3f46"/>
  <circle cx="66" cy="46" r="5" fill="#3f3f46"/>
  <circle cx="82" cy="46" r="5" fill="#3f3f46"/>
  <text x="105" y="50" fill="#a1a1aa" font-family="monospace" font-size="12">nutrivoice-ai :: bedrock-converse :: mcp-jsonrpc</text>
  <rect x="615" y="35" width="145" height="22" rx="6" fill="#121215" stroke="#27272a" stroke-width="1"/>
  <text x="687" y="50" fill="#10b981" font-family="monospace" font-size="11" text-anchor="middle">● MCP PROTOCOL: LIVE</text>

  <!-- Left: Audio Telemetry & Bedrock Converse -->
  <g transform="translate(45, 85)">
    <rect x="0" y="0" width="345" height="315" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="18" y="28" fill="#fafafa" font-family="monospace" font-size="13" font-weight="bold">VOICE INGEST &amp; ROUTING</text>
    <text x="18" y="48" fill="#71717a" font-family="monospace" font-size="11">Web Speech API · Haiku (~380ms) + Sonnet 3.5</text>

    <!-- Waveform Box -->
    <rect x="18" y="65" width="309" height="100" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
    <path d="M 28 115 Q 48 80 68 115 T 108 115 T 148 70 T 188 115 T 228 150 T 268 115 T 308 115" stroke="#52525b" stroke-width="2" fill="none"/>
    <path d="M 28 115 Q 48 95 68 115 T 108 115 T 148 85 T 188 115 T 228 135 T 268 115 T 308 115" stroke="#fafafa" stroke-width="1.5" fill="none"/>
    <text x="28" y="85" fill="#a1a1aa" font-family="monospace" font-size="10">STREAM: "Ate 2 eggs, avocado toast &amp; black coffee"</text>
    <text x="28" y="150" fill="#10b981" font-family="monospace" font-size="10">LATENCY: 382ms [CLASSIFICATION → EXTRACTION]</text>

    <!-- Pydantic Contracts -->
    <rect x="18" y="180" width="309" height="110" rx="6" fill="#121215" stroke="#27272a" stroke-width="1"/>
    <text x="28" y="202" fill="#71717a" font-family="monospace" font-size="11">TYPED CONTRACT VALIDATION</text>
    <text x="28" y="224" fill="#fafafa" font-family="monospace" font-size="11">class MealLog(BaseModel):</text>
    <text x="45" y="242" fill="#d4d4d8" font-family="monospace" font-size="10">protein_g: float = Field(ge=0)</text>
    <text x="45" y="260" fill="#d4d4d8" font-family="monospace" font-size="10">calories: int = Field(ge=50, le=3000)</text>
    <text x="28" y="278" fill="#10b981" font-family="monospace" font-size="10">✓ Guardrails: allergen &amp; anomaly checks passed</text>
  </g>

  <!-- Right: Model Context Protocol (MCP) -->
  <g transform="translate(410, 85)">
    <rect x="0" y="0" width="345" height="315" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="18" y="28" fill="#fafafa" font-family="monospace" font-size="13" font-weight="bold">MODEL CONTEXT PROTOCOL (MCP)</text>
    <text x="18" y="48" fill="#71717a" font-family="monospace" font-size="11">Decoupled Reasoning &amp; Database Mutations</text>

    <!-- MCP JSON-RPC Box -->
    <rect x="18" y="65" width="309" height="135" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
    <text x="28" y="88" fill="#71717a" font-family="monospace" font-size="10">// JSON-RPC 2.0 MCP Mutation Payload</text>
    <text x="28" y="106" fill="#fafafa" font-family="monospace" font-size="10">{"jsonrpc": "2.0", "method": "tools/call",</text>
    <text x="38" y="124" fill="#d4d4d8" font-family="monospace" font-size="10"> "params": {"name": "record_nutrition",</text>
    <text x="48" y="142" fill="#a1a1aa" font-family="monospace" font-size="10">  "args": {"calories": 420, "protein": 24.5}}}</text>
    <text x="28" y="165" fill="#10b981" font-family="monospace" font-size="10">STATUS 200 OK → DynamoDB / SQLite Persisted</text>
    <text x="28" y="185" fill="#71717a" font-family="monospace" font-size="10">Deterministic zero-side-effect LLM sandbox</text>

    <!-- Telemetry Cards -->
    <rect x="18" y="215" width="145" height="75" rx="6" fill="#121215" stroke="#27272a" stroke-width="1"/>
    <text x="28" y="238" fill="#71717a" font-family="monospace" font-size="10">ROUTING ENGINE</text>
    <text x="28" y="260" fill="#fafafa" font-family="monospace" font-size="14" font-weight="bold">Claude 3 Haiku</text>
    <text x="28" y="278" fill="#10b981" font-family="monospace" font-size="10">Sub-400ms Turn</text>

    <rect x="182" y="215" width="145" height="75" rx="6" fill="#121215" stroke="#27272a" stroke-width="1"/>
    <text x="192" y="238" fill="#71717a" font-family="monospace" font-size="10">REASONING CORE</text>
    <text x="192" y="260" fill="#fafafa" font-family="monospace" font-size="14" font-weight="bold">Sonnet 3.5</text>
    <text x="192" y="278" fill="#10b981" font-family="monospace" font-size="10">Slot-Filling Agent</text>
  </g>
</svg>
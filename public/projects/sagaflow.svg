<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#0e0e12"/>
  <defs>
    <pattern id="grid2" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#27272a" stroke-width="0.5" stroke-opacity="0.6"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid2)"/>
  <rect x="40" y="40" width="720" height="370" rx="12" fill="#121216" stroke="#27272a" stroke-width="1"/>
  <text x="730" y="75" fill="#10b981" font-family="monospace" font-size="12" text-anchor="end">● SAGA ORCHESTRATOR // 46 TESTS</text>
  <g transform="translate(80, 120)">
    <rect x="0" y="0" width="180" height="90" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <text x="20" y="35" fill="#fafafa" font-family="monospace" font-size="13" font-weight="bold">[1] INVENTORY</text>
    <text x="20" y="60" fill="#a1a1aa" font-family="monospace" font-size="11">Reserved (Compensable)</text>
    <line x1="180" y1="45" x2="230" y2="45" stroke="#52525b" stroke-width="2" stroke-dasharray="4"/>

    <rect x="230" y="0" width="180" height="90" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <text x="250" y="35" fill="#fafafa" font-family="monospace" font-size="13" font-weight="bold">[2] PAYMENT</text>
    <text x="250" y="60" fill="#a1a1aa" font-family="monospace" font-size="11">Authorized (2PC/Outbox)</text>
    <line x1="410" y1="45" x2="460" y2="45" stroke="#52525b" stroke-width="2" stroke-dasharray="4"/>

    <rect x="460" y="0" width="180" height="90" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <text x="480" y="35" fill="#fafafa" font-family="monospace" font-size="13" font-weight="bold">[3] SHIPPING</text>
    <text x="480" y="60" fill="#a1a1aa" font-family="monospace" font-size="11">Dispatched (RabbitMQ)</text>
  </g>
  <text x="80" y="280" fill="#fafafa" font-family="sans-serif" font-size="22" font-weight="bold">SagaFlow Distributed Engine</text>
  <text x="80" y="315" fill="#a1a1aa" font-family="monospace" font-size="13">Persisted State Machine · Optimistic Locking · Transactional Outbox</text>
  <text x="80" y="345" fill="#71717a" font-family="monospace" font-size="12">Reverse Compensating Transactions · Crash Recovery Sweeper</text>
</svg>
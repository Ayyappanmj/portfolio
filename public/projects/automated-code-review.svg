<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <pattern id="grid-acr" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#27272a" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="#09090b"/>
  <rect width="800" height="450" fill="url(#grid-acr)"/>
  <rect x="25" y="25" width="750" height="400" rx="14" fill="#121215" stroke="#27272a" stroke-width="1.5"/>
  
  <!-- Header Bar -->
  <rect x="25" y="25" width="750" height="42" rx="14" fill="#18181b"/>
  <circle cx="50" cy="46" r="5" fill="#3f3f46"/>
  <circle cx="66" cy="46" r="5" fill="#3f3f46"/>
  <circle cx="82" cy="46" r="5" fill="#3f3f46"/>
  <text x="105" y="50" fill="#a1a1aa" font-family="monospace" font-size="12">code-review-auditor :: git-diff-engine :: ast-bandit</text>
  <rect x="635" y="35" width="125" height="22" rx="6" fill="#121215" stroke="#27272a" stroke-width="1"/>
  <text x="697" y="50" fill="#10b981" font-family="monospace" font-size="11" text-anchor="middle">● PR HOOK: ACTIVE</text>

  <!-- Left: Git Diff & AST Scanner -->
  <g transform="translate(45, 85)">
    <rect x="0" y="0" width="345" height="315" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="18" y="28" fill="#fafafa" font-family="monospace" font-size="13" font-weight="bold">GIT DIFF &amp; STATIC ANALYSIS</text>
    <text x="18" y="48" fill="#71717a" font-family="monospace" font-size="11">AST Parsing · Bandit SAST · Flake8 Style</text>

    <!-- Code Block -->
    <rect x="18" y="65" width="309" height="150" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
    <text x="30" y="90" fill="#ef4444" font-family="monospace" font-size="11">- cursor.execute(f"SELECT * FROM u WHERE id={uid}")</text>
    <text x="30" y="112" fill="#10b981" font-family="monospace" font-size="11">+ cursor.execute("SELECT * FROM u WHERE id=%s", (uid,))</text>
    <text x="30" y="140" fill="#eab308" font-family="monospace" font-size="10">▲ BANDIT WARNING B608: Hardcoded SQL injection</text>
    <text x="30" y="160" fill="#a1a1aa" font-family="monospace" font-size="10">→ AST remediation suggested: parameterized query</text>
    <text x="30" y="180" fill="#71717a" font-family="monospace" font-size="10">✓ Flake8: E501 line length resolved</text>

    <!-- Status Cards -->
    <rect x="18" y="230" width="145" height="60" rx="6" fill="#121215" stroke="#27272a" stroke-width="1"/>
    <text x="30" y="252" fill="#71717a" font-family="monospace" font-size="10">VULN DETECTION</text>
    <text x="30" y="274" fill="#fafafa" font-family="monospace" font-size="14" font-weight="bold">OWASP Top 10</text>

    <rect x="182" y="230" width="145" height="60" rx="6" fill="#121215" stroke="#27272a" stroke-width="1"/>
    <text x="194" y="252" fill="#71717a" font-family="monospace" font-size="10">AUTOMATION</text>
    <text x="194" y="274" fill="#fafafa" font-family="monospace" font-size="14" font-weight="bold">Inline PR Bot</text>
  </g>

  <!-- Right: LLM Remediation & GitHub PR Comments -->
  <g transform="translate(410, 85)">
    <rect x="0" y="0" width="345" height="315" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="18" y="28" fill="#fafafa" font-family="monospace" font-size="13" font-weight="bold">AI CODE REVIEW BOT</text>
    <text x="18" y="48" fill="#71717a" font-family="monospace" font-size="11">Automated Inline GitHub Review Feedback</text>

    <!-- PR Comment Card -->
    <rect x="18" y="65" width="309" height="110" rx="6" fill="#121215" stroke="#27272a" stroke-width="1"/>
    <circle cx="36" cy="85" r="8" fill="#27272a"/>
    <text x="52" y="89" fill="#fafafa" font-family="monospace" font-size="11" font-weight="bold">ReviewerBot</text>
    <text x="135" y="89" fill="#71717a" font-family="monospace" font-size="10">bot reviewed 2m ago</text>
    <text x="30" y="115" fill="#d4d4d8" font-family="monospace" font-size="11">Security issue detected in auth/dao.py:L42.</text>
    <text x="30" y="133" fill="#a1a1aa" font-family="monospace" font-size="10">Parameterized input applied via auto-patch #104.</text>
    <text x="30" y="153" fill="#10b981" font-family="monospace" font-size="10">✓ Automated pytest suite passed (24/24 tests)</text>

    <!-- Stats Table -->
    <rect x="18" y="190" width="309" height="100" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
    <text x="30" y="215" fill="#71717a" font-family="monospace" font-size="11">SCAN METRIC</text>
    <text x="210" y="215" fill="#71717a" font-family="monospace" font-size="11">BENCHMARK</text>
    <line x1="30" y1="225" x2="310" y2="225" stroke="#27272a" stroke-width="1"/>
    <text x="30" y="245" fill="#fafafa" font-family="monospace" font-size="11">Diff Parse Latency</text>
    <text x="210" y="245" fill="#10b981" font-family="monospace" font-size="11">&lt; 120ms</text>
    <text x="30" y="268" fill="#fafafa" font-family="monospace" font-size="11">False Positive Filter</text>
    <text x="210" y="268" fill="#10b981" font-family="monospace" font-size="11">96.4% Clean</text>
  </g>
</svg>